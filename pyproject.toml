[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nexcoder"
version = "0.1.0"
description = "NexCoder â€” AI-First Code Editor for the Nexa Ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Nexa Team"}]

dependencies = [
    "PySide6>=6.7.0",
    "pywinpty>=2.0.0",            # Windows PTY
    "GitPython>=3.1.0",           # Git operations
    "httpx>=0.27.0",              # Async HTTP for AI API
    "watchdog>=4.0.0",            # File system watching
    "appwrite>=6.0.0",            # Appwrite Python SDK
    "python-dotenv>=1.0.0",       # .env file loading
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.scripts]
nexcoder = "nexcoder.main:main"
nexcoder-cli = "nexcoder.cli:main"
[tool.setuptools.packages.find]
include = ["nexcoder*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

